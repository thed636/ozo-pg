name: Set up build dependencies
description: >-
  Installs CMake, Ninja, libpq and a specific Boost version. OZO requires
  Boost >= 1.86, which is newer than any Boost currently packaged by the
  Ubuntu runners, so on Linux Boost is built from the upstream archive and
  cached. On macOS the Homebrew Boost is used and the version input is
  ignored, since Homebrew only ever offers the current release.

inputs:
  boost-version:
    description: Boost version to build on Linux, e.g. "1.86.0"
    required: true

runs:
  using: composite
  steps:
    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build libpq-dev postgresql-server-dev-all

    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake ninja boost libpq

    - name: Cache Boost (Linux)
      if: runner.os == 'Linux'
      id: cache-boost
      uses: actions/cache@v4
      with:
        path: ~/boost-install
        key: boost-${{ inputs.boost-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build Boost from source (Linux)
      if: runner.os == 'Linux' && steps.cache-boost.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.boost-version }}"
        underscored="${version//./_}"
        curl -fsSL --retry 3 -o boost.tar.bz2 \
          "https://archives.boost.io/release/${version}/source/boost_${underscored}.tar.bz2"
        tar xf boost.tar.bz2
        cd "boost_${underscored}"
        # Only the compiled libraries OZO and resource_pool link against;
        # b2 pulls in their dependencies (chrono, date_time) automatically.
        ./bootstrap.sh --prefix="$HOME/boost-install" \
          --with-libraries=coroutine,context,thread,atomic
        ./b2 -j"$(nproc)" -d0 install

    - name: Expose dependency locations
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "macOS" ]; then
          echo "CMAKE_PREFIX_PATH=$(brew --prefix boost):$(brew --prefix libpq)" >> "$GITHUB_ENV"
          echo "PostgreSQL_ROOT=$(brew --prefix libpq)" >> "$GITHUB_ENV"
        else
          echo "CMAKE_PREFIX_PATH=$HOME/boost-install" >> "$GITHUB_ENV"
        fi

    - name: Report resolved versions
      shell: bash
      run: |
        set -euo pipefail
        cmake --version | head -1
        for header in \
          "$HOME/boost-install/include/boost/version.hpp" \
          "$(brew --prefix boost 2>/dev/null)/include/boost/version.hpp"
        do
          if [ -f "$header" ]; then
            echo "Boost: $(grep 'define BOOST_LIB_VERSION' "$header" | awk '{print $3}')"
            break
          fi
        done
