name: CI

on:
  push:
    branches: [master, main, modernize-boost]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oldest supported Boost, used by the jobs that do not sweep versions.
  BOOST_MIN: 1.86.0

jobs:
  # Library and examples across the supported Boost range and both compilers.
  # 1.86 is the declared minimum, 1.90 the current release; Linux builds Boost
  # from source because no Ubuntu runner packages anything recent enough.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux · gcc · boost 1.86",   os: ubuntu-24.04, cc: gcc,   cxx: g++,     boost: 1.86.0 }
          - { name: "linux · gcc · boost 1.90",   os: ubuntu-24.04, cc: gcc,   cxx: g++,     boost: 1.90.0 }
          - { name: "linux · clang · boost 1.86", os: ubuntu-24.04, cc: clang, cxx: clang++, boost: 1.86.0 }
          - { name: "linux · clang · boost 1.90", os: ubuntu-24.04, cc: clang, cxx: clang++, boost: 1.90.0 }
          - { name: "macos · applecl · brew",     os: macos-14,     cc: clang, cxx: clang++, boost: 1.90.0 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          boost-version: ${{ matrix.boost }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOZO_BUILD_EXAMPLES=ON

      - name: Build library and examples
        run: cmake --build build -j

  # Unit tests. Separate from `build` because the suite pulls GoogleTest via
  # ExternalProject and compiles with -Werror, making it the job most likely to
  # need attention on a new compiler or Boost release.
  unit-tests:
    name: unit tests · ${{ matrix.cxx }} · boost ${{ matrix.boost }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   cxx: g++,     boost: 1.86.0 }
          - { cc: clang, cxx: clang++, boost: 1.90.0 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          boost-version: ${{ matrix.boost }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOZO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run
        run: ctest --test-dir build --output-on-failure

  # Integration tests against real PostgreSQL. Note that each run gets a fresh
  # database, which is what let the non-idempotent ltree tests go unnoticed for
  # years; the suite is run twice here so that state left behind fails CI.
  integration-tests:
    name: integration tests · postgres ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 17]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: ozo
          POSTGRES_USER: ozo
          POSTGRES_DB: ozo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ozo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          boost-version: ${{ env.BOOST_MIN }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOZO_BUILD_TESTS=ON \
            -DOZO_BUILD_PG_TESTS=ON \
            -DOZO_PG_TEST_CONNINFO="host=localhost port=5432 user=ozo password=ozo dbname=ozo"

      - name: Build
        run: cmake --build build -j

      - name: Run
        run: ctest --test-dir build --output-on-failure

      - name: Run again to catch tests that leave state behind
        run: ctest --test-dir build --output-on-failure

  # Verifies the installed package works for a downstream consumer: that
  # find_package(ozo) resolves, that ozo::ozo is the target, and that no
  # removed Boost component is still requested by the installed config files.
  # An in-tree build passing every test does not prove any of this.
  install-and-consume:
    name: install & consume (ozo::ozo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-deps
        with:
          boost-version: ${{ env.BOOST_MIN }}

      - name: Install ozo
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build --target install

      - name: Consume via find_package
        run: |
          mkdir -p consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(consumer CXX)
          find_package(ozo REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ozo::ozo)
          EOF
          cat > main.cpp <<'EOF'
          #include <ozo/ozo.h>
          #include <ozo/request.h>
          int main() { ozo::io_context io; (void)io; return 0; }
          EOF
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix;$CMAKE_PREFIX_PATH"
          cmake --build build
