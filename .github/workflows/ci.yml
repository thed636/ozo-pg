name: CI

on:
  push:
    branches: [master, main, modernize-boost]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared between every job that installs dependencies from apt.
  APT_PACKAGES: cmake ninja-build libboost-all-dev libpq-dev

jobs:
  # Library and examples on the current LTS, which packages Boost 1.90.
  # GitHub only publishes LTS runner images, so this is the newest Boost
  # available without building one; the declared 1.88 floor is covered by
  # the build-min-boost job below.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ubuntu-26.04 · gcc",   os: ubuntu-26.04, cc: gcc,   cxx: g++ }
          - { name: "ubuntu-26.04 · clang", os: ubuntu-26.04, cc: clang, cxx: clang++ }
          - { name: "macos-14 · applecl",   os: macos-14,     cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja boost libpq
          echo "CMAKE_PREFIX_PATH=$(brew --prefix boost):$(brew --prefix libpq)" >> "$GITHUB_ENV"
          echo "PostgreSQL_ROOT=$(brew --prefix libpq)" >> "$GITHUB_ENV"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOZO_BUILD_EXAMPLES=ON

      - name: Build library and examples
        run: cmake --build build -j

  # Verifies the declared Boost minimum actually builds. No hosted runner
  # image ships 1.88 (GitHub publishes LTS images only, and no LTS packages
  # it), so this runs in an Ubuntu 25.10 container purely to get that Boost
  # from apt. Without this job the floor would be an untested claim.
  build-min-boost:
    name: minimum boost (1.88)
    runs-on: ubuntu-latest
    container: ubuntu:25.10

    steps:
      # git must exist before checkout, so that it clones rather than falling
      # back to downloading a source archive.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates g++ $APT_PACKAGES

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Confirm the Boost version under test
        run: grep 'define BOOST_LIB_VERSION' /usr/include/boost/version.hpp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOZO_BUILD_EXAMPLES=ON

      - name: Build library and examples
        run: cmake --build build -j

  # Unit tests. Separate from `build` because the suite pulls GoogleTest via
  # ExternalProject and compiles with -Werror, making it the job most likely
  # to need attention on a new compiler or Boost release.
  unit-tests:
    name: unit tests · ${{ matrix.cxx }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOZO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run
        run: ctest --test-dir build --output-on-failure

  # Integration tests against real PostgreSQL. The suite is run twice: each
  # CI run gets a fresh database, which is exactly what hid the two
  # non-idempotent ltree tests for years, so state left behind must fail here.
  integration-tests:
    name: integration tests · postgres ${{ matrix.pg }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 17]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: ozo
          POSTGRES_USER: ozo
          POSTGRES_DB: ozo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ozo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOZO_BUILD_TESTS=ON \
            -DOZO_BUILD_PG_TESTS=ON \
            -DOZO_PG_TEST_CONNINFO="host=localhost port=5432 user=ozo password=ozo dbname=ozo"

      - name: Build
        run: cmake --build build -j

      - name: Run
        run: ctest --test-dir build --output-on-failure

      - name: Run again to catch tests that leave state behind
        run: ctest --test-dir build --output-on-failure

  # Verifies the installed package works for a downstream consumer: that
  # find_package(ozo) resolves, that ozo::ozo is the target, and that no
  # removed Boost component is still requested by the installed config files.
  # An in-tree build passing every test does not prove any of this — a stale
  # Boost::system in resource_poolConfig.cmake got through exactly that way.
  install-and-consume:
    name: install & consume (ozo::ozo)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install ozo
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build --target install

      - name: Consume via find_package
        run: |
          mkdir -p consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(consumer CXX)
          find_package(ozo REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ozo::ozo)
          EOF
          cat > main.cpp <<'EOF'
          #include <ozo/ozo.h>
          #include <ozo/request.h>
          int main() { ozo::io_context io; (void)io; return 0; }
          EOF
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix"
          cmake --build build
